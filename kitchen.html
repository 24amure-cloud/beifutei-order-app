<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FDF9F1" />
<link rel="manifest" href="/manifest-kitchen.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="厨房" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<meta name="robots" content="noindex, nofollow" />
<title>スタッフ・オーダー管理（店舗用）</title>
</head>
<body>
<div id="root"></div>
<div id="boot-fallback" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#fdf9f1;color:#2a2419;text-align:center;line-height:1.6">読み込み中…</div>
<script>(function(){var r=document.getElementById("root"),f=document.getElementById("boot-fallback");
function h(){if(r&&r.childElementCount>0&&f)f.style.display="none";}
if(r)new MutationObserver(h).observe(r,{childList:true,subtree:true});
function showBootFail(){h();if(!r||r.childElementCount>0||!f)return;
var q=location.search?location.search+"&":"?";var clearHref=location.pathname+q+"clearsw=1";
f.innerHTML="<p style=\"font-weight:700;margin:0 0 12px\">スタッフ画面を表示できません</p><p style=\"margin:0 0 14px;font-size:15px\">デプロイ直後は古いPWAキャッシュでJSが読めないことがあります。</p><p style=\"margin:0\"><a href=\""+clearHref+"\" style=\"display:inline-block;padding:12px 18px;background:#2a2419;color:#fdf9f1;border-radius:10px;font-weight:700;text-decoration:none\">キャッシュを消して再読み込み</a></p><p style=\"margin:14px 0 0;font-size:13px;opacity:.85\">効かない場合: Safari → 設定 → Webサイトデータ → このサイトを削除</p>";}
setTimeout(showBootFail,12000);
window.addEventListener("error",function(ev){if(ev&&ev.message&&/Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module/i.test(ev.message))showBootFail();},true);})();</script>
<script type="module" src="/src/kitchen.jsx"></script>
</body>
</html>
